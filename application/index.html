<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart To-Do</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>My To-Do List</h1>

        <div class="task-input">
            <label for="taskInput">Task name</label>
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task"
            >

            <label for="dueDateInput">Due date (optional)</label>
            <input type="date" id="dueDateInput">

            <label for="remindAtInput">Remind me at (optional)</label>
            <input type="datetime-local" id="remindAtInput">
            <p class="help-text">Note: reminders work only while this page is open.</p>

            <div id="formError" class="form-error" hidden></div>

            <button id="addTaskButton">Add Task</button>
        </div>

        <h2>My Tasks</h2>

        <div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>

        <ul id="taskList"></ul>

        <p id="taskSummary">No tasks available</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
