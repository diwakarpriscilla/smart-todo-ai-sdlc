
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart To-Do</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>My To-Do List</h1>

        <div class="task-input">
            <label for="taskInput">Task name</label>
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task"
            >

            <label for="prioritySelect">Priority</label>
            <select id="prioritySelect">
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
            </select>

            <button id="addTaskButton">Add Task</button>
        </div>

        <h2>My Tasks</h2>

        <div class="filters" role="group" aria-label="Filter tasks">
            <button type="button" class="filter-button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="filter-button" data-filter="active" aria-pressed="false">Active</button>
            <button type="button" class="filter-button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>

        <p id="editNotice" class="edit-notice" role="alert" hidden></p>

        <ul id="taskList"></ul>

        <p id="taskSummary">No tasks available</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
